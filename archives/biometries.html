<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biométries fœtales — saisie hors ligne</title>
<style>
:root{--bg:#0e1117;--card:#171b22;--line:#262c36;--txt:#e6edf3;--dim:#8b949e;
--blue:#3b82f6;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#a855f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:1rem;margin:0;flex:1}
.badge{background:var(--blue);color:#fff;border-radius:6px;padding:3px 9px;font-size:.8rem;font-weight:600}
.badge.off{background:var(--line);color:var(--dim)}
main{padding:14px;max-width:640px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
section>h2{font-size:.9rem;margin:0;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
section>h2 .count{margin-left:auto;font-size:.72rem;color:var(--dim);font-weight:500}
section>div{padding:0 14px 14px}
section.shut>div{display:none}
label{display:block;font-size:.75rem;color:var(--dim);margin-bottom:4px}
input{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;
color:var(--txt);padding:11px 12px;font-size:1rem;font-family:inherit}
input:focus{outline:none;border-color:var(--blue)}
.f{margin-bottom:12px;position:relative}
.f .unit{position:absolute;right:12px;top:29px;font-size:.75rem;color:var(--dim);pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.ds{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;min-height:1px}
.t{font-size:.68rem;font-weight:600;padding:2px 6px;border-radius:4px;background:#1f2733;color:var(--dim)}
.t.alert{background:var(--red);color:#fff}
.hint{font-size:.72rem;color:var(--dim);margin:-4px 0 12px}
#lock{background:var(--orange);color:#000;padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:12px}
#body[inert],#body.off{opacity:.35;pointer-events:none}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 14px;
background:var(--card);border-top:1px solid var(--line)}
button{flex:1;border:none;border-radius:9px;padding:13px;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer}
.p{background:var(--blue);color:#fff;flex:2}.s{background:var(--line);color:var(--txt)}
#toast{position:fixed;bottom:78px;left:14px;right:14px;background:#000d;border:1px solid var(--line);
border-radius:9px;padding:12px;font-size:.82rem;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;white-space:pre-line}
#toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <h1>📏 Biométries fœtales</h1>
  <span class="badge off" id="badge">—</span>
</header>

<main>

<section id="sec-id">
  <h2><span>🪪</span>Identification<span class="count" id="c-id">requis</span></h2>
  <div>
    <div class="row">
      <div class="f"><label>N° de dossier</label><input id="dossier" placeholder="25P1234" autocomplete="off"></div>
      <div class="f"><label>Opérateur</label><input id="operateur" placeholder="Nom" autocomplete="off"></div>
    </div>
    <div class="hint">Format attendu <b>aaPnnnn</b>. Les deux champs débloquent la saisie.</div>
  </div>
</section>

<div id="lock">Renseigner le dossier et l'opérateur pour débloquer la saisie.</div>

<div id="body" class="off">

<section id="sec-terme">
  <h2><span>📅</span>Terme<span class="count" id="c-terme">—</span></h2>
  <div class="row">
    <div class="f"><label>SA</label><input type="number" id="terme_sa" min="10" max="45" step="1" inputmode="numeric" placeholder="—"><div class="unit">sem.</div></div>
    <div class="f"><label>+ jours</label><input type="number" id="terme_j" min="0" max="6" step="1" inputmode="numeric" placeholder="0"><div class="unit">j</div></div>
  </div>
</section>

<section id="sec-balance">
  <h2><span>⚖️</span>Balance<span class="count" id="c-balance">0/1</span></h2>
  <div id="b-balance"></div>
</section>

<section id="sec-caliper">
  <h2><span>📐</span>Pied à coulisse<span class="count" id="c-caliper">0/10</span></h2>
  <div id="b-caliper"></div>
</section>

<section id="sec-tape">
  <h2><span>📏</span>Mètre ruban<span class="count" id="c-tape">0/5</span></h2>
  <div id="b-tape"></div>
</section>

</div>
</main>

<footer>
  <button class="p" onclick="exportJSON()">⬇ Exporter le JSON</button>
  <button class="s" onclick="wipe()">🗑 Vider</button>
</footer>
<div id="toast"></div>

  if(!isFinite(v)||m==null||sd==null||!sd) return null;
  return (v-m)/sd;
}
function tag(z,src){
  if(z===null) return '';
  var r=Math.round(z*100)/100;

    return '<div class="f"><label>'+f.l+'</label>'
      +'<input type="number" step="'+inst.step+'" min="0" inputmode="decimal" '
      +'id="v_'+f.id+'" placeholder="—">'
      +'<div class="unit">'+inst.unit+'</div><div class="ds" id="z_'+f.id+'"></div></div>';
  }).join('');
});

document.querySelectorAll('section>h2').forEach(function(h){
  h.onclick=function(){h.parentNode.classList.toggle('shut')};
});

/* ════ Z-SCORES ════ */
function refresh(){
  var sa=parseInt(val('terme_sa'),10);
  var gk=gcKey(sa), ma=maRow(sa), mb=mbRow(sa);
  ALL.forEach(function(f){
    var v=parseFloat(val('v_'+f.id)), h='';
    if(isFinite(v)){
      if(f.gc&&gk&&GC[gk][f.gc]) h+=tag(zscore(v,GC[gk][f.gc].m,GC[gk][f.gc].sd),'GC');
      if(f.ma&&ma&&ma[f.ma])     h+=tag(zscore(v/(f.mad||1),ma[f.ma].m,ma[f.ma].sd),'MA');
      if(f.mb&&mb&&mb[f.mb])     h+=tag(zscore(v/(f.mbd||1),mb[f.mb].m,mb[f.mb].sd),'MB');
    }
    $('z_'+f.id).innerHTML=h;
  });
  $('c-terme').textContent = sa ? sa+' SA'+(val('terme_j')?' +'+val('terme_j')+'j':'') : '—';
  INSTRUMENTS.forEach(function(inst){
    var n=inst.fields.filter(function(f){return val('v_'+f.id)!==''}).length;
    $('c-'+inst.id).textContent=n+'/'+inst.fields.length;
  });
}

/* ════ VERROU IDENTIFICATION ════ */
function normDossier(s){return s.replace(/^(\d{2})p/i,'$1P')}

function checkGate(){
  var d=$('dossier'); d.value=normDossier(d.value);
  var nd=d.value.trim(), no=val('operateur');
  var ok = /^\d{2}P\d+$/.test(nd) && no.length>0;
  $('body').classList.toggle('off',!ok);
  $('lock').style.display = ok?'none':'block';
  $('badge').textContent = ok?nd:'—';
  $('badge').classList.toggle('off',!ok);
  $('c-id').textContent = ok?'OK':'requis';
  if(ok && nd!==dossier){ dossier=nd; operateur=no; restore(); }
  else if(ok){ operateur=no; }
  return ok;
}

/* ════ CACHE (localStorage) ════
   ponytail: pas d'IndexedDB ici — la biométrie n'a que des scalaires, ça tient
   largement dans localStorage. Passer à IndexedDB sur les modules à photos. */
var PREFIX='hubhtml_biometries_';

function collect(){
  var b={};
  ALL.forEach(function(f){var v=parseFloat(val('v_'+f.id)); b[f.id]=isFinite(v)?v:null});
  return {
    // schema: les fichiers sont diffusés en copies ; l'ingestion verra des
    // exports produits par des versions plus vieilles que la sienne.
    schema:1, module:'biometries', dossier:dossier, operateur:operateur,
    saved_at:new Date().toISOString(),
    terme:{sa:parseInt(val('terme_sa'),10)||null, jours:parseInt(val('terme_j'),10)||0},
    biometries:b
  };
}

var timer=null;
function cache(){
  if(!dossier) return;
  clearTimeout(timer);
  timer=setTimeout(function(){
    try{ localStorage.setItem(PREFIX+dossier, JSON.stringify(collect())); }
    catch(e){ toast('⚠ Cache plein : '+e.name); }
  },400);
}

function restore(){
  var raw=null;
  try{ raw=localStorage.getItem(PREFIX+dossier); }catch(e){}
  if(!raw) return;
  var d=JSON.parse(raw);
  if(d.terme){ $('terme_sa').value=d.terme.sa||''; $('terme_j').value=d.terme.jours||''; }
  ALL.forEach(function(f){
    var v=d.biometries?d.biometries[f.id]:null;
    $('v_'+f.id).value = (v==null?'':v);
  });
  refresh();
  toast('↺ Saisie restaurée — '+new Date(d.saved_at).toLocaleString('fr-FR'));
}

/* ════ EXPORT / PURGE ════ */
function exportJSON(){
  if(!checkGate()) return toast('⚠ Dossier et opérateur requis avant export.');
  var data=collect();
  var url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  var a=document.createElement('a');
  a.href=url; a.download=dossier+'_biometries.json';
  a.click(); URL.revokeObjectURL(url);
  toast('⬇ '+a.download);
}

function wipe(){
  var keys=Object.keys(localStorage).filter(function(k){return k.indexOf('hubhtml_')===0});
  if(!confirm('Effacer '+keys.length+' saisie(s) en cache ?\nAction irréversible.')) return;
  keys.forEach(function(k){localStorage.removeItem(k)});
  if(indexedDB.databases) indexedDB.databases().then(function(dbs){
    dbs.forEach(function(db){ if(db.name&&db.name.indexOf('hubhtml')===0) indexedDB.deleteDatabase(db.name); });
  });
  location.reload();
}

function toast(m){
  var t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on')},3000);
}

/* ════ CÂBLAGE ════ */
['dossier','operateur'].forEach(function(id){ $(id).addEventListener('input',checkGate) });
document.querySelectorAll('#body input').forEach(function(i){
  i.addEventListener('input',function(){ refresh(); cache(); });
});
window.addEventListener('beforeunload',function(){ clearTimeout(timer); if(dossier) try{localStorage.setItem(PREFIX+dossier,JSON.stringify(collect()))}catch(e){} });
checkGate(); refresh();

  chk('VT mm->cm vers MA',    zscore(246/10, maRow(20).H.m, maRow(20).H.sd)===0);

  // Flux réel : verrou → saisie → cache → restauration
  function type(id,v){ $(id).value=v; $(id).dispatchEvent(new Event('input')); }

  type('v_vt',''); dossier='25P9999'; restore();
  chk('restore() récupère VT',  $('v_vt').value==='246');
  localStorage.removeItem(PREFIX+'25P9999');

  document.body.insertAdjacentHTML('afterbegin',
    '<pre style="background:'+(ko.length?'#7f1d1d':'#14532d')+';color:#fff;padding:14px;margin:0;white-space:pre-wrap">'
    +(ko.length?'ÉCHEC ('+ko.length+') :\n  '+ko.join('\n  ')+'\n\n':'')
    +'OK : '+ok.length+'/'+(ok.length+ko.length)+'</pre>');
}
